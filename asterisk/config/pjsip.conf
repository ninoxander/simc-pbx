; ==========================================
; Configuración Global y Transporte
; ==========================================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=127.0.0.1/32
local_net=192.168.0.0/24
external_media_address=192.168.0.59
external_signaling_address=192.168.0.59

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ==========================================
; Extensión 1001 (iPhone / Linphone)
; ==========================================
[1001]
type=endpoint
context=default
transport=transport-udp
disallow=all
allow=ulaw,alaw,opus
auth=auth1001
aors=1001
rewrite_contact=yes
direct_media=no

[auth1001]
type=auth
auth_type=userpass
username=1001
password=SuperClave123!

[1001]
type=aor
max_contacts=2
remove_existing=yes

; ==========================================
; Extensión 1002 (Agente)
; ==========================================
[1002]
type=endpoint
context=default
transport=transport-udp
disallow=all
allow=ulaw,alaw,opus
auth=auth1002
aors=1002
rewrite_contact=yes
direct_media=no

[auth1002]
type=auth
