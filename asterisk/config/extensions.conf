[general]
static=yes
writeprotect=no

[default]
exten => 600,1,NoOp(Prueba de Echo)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 700,1,NoOp(Prueba de Audio TTS)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/bienvenida)
 same => n,Wait(1)
 same => n,Hangup()

exten => 1002,1,NoOp(Llamando directo al iPhone 1002)
 same => n,Dial(PJSIP/1002,25)
 same => n,Hangup()

; ==========================================
; PRUEBA STT EN TIEMPO REAL (702)
; ==========================================
exten => 702,1,NoOp(Iniciando grabacion e inferencia STT)
 same => n,Answer()
 same => n,Wait(0.5)

 ; Beep inicial para hablar
 same => n,Playback(beep)

 ; Graba en formato wav a 8kHz. Corta tras 2 seg de silencio o maximo 5 seg.
 ; 'k' = conserva la grabacion; 'q' = modo silencioso (sin beep automatico de Record)
 same => n,Record(/var/lib/asterisk/sounds/custom/audio_stt:wav,2,5,k)

 ; Espera 200ms para garantizar que el archivo .wav este cerrado y sincronizado en disco
 same => n,Wait(0.2)

 ; Ejecuta curl hacia el endpoint
 same => n,System(curl -s -X POST "http://stt_service:8000/stt/transcribe" -H "Content-Type: application/json" -d '{"audio_path":"/app/sounds/custom/grabacion.wav"}') json" -d '{"filepath":"/app/sounds/audio_stt.wav"}')

 ; Beep de confirmacion al completar la transcripcion
 same => n,Playback(beep) 
 same => n,Wait(0.5)
 same => n,Hangup()
