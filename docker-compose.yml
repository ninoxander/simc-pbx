version: '3.8'

services:
  # Asterisk
  asterisk:
    image: andrius/asterisk:latest
    container_name: asterisk_service
    restart: always
    network_mode: host
    volumes:
      - ./asterisk/config:/etc/asterisk
      - ./asterisk/sounds:/var/lib/asterisk/sounds/custom
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1024M
        reservations:
          memory: 512M

  # Golang
  security-middleware:
    build:
      context: ./golang-middleware
      dockerfile: Dockerfile
    container_name: go_security
    restart: always
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHON_SERVICE_URL=http://python-core:5000
      - ASTERISK_HOST=host.docker.internal
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 256M
        reservations:
          memory: 64M
    depends_on:
      - python-core

  # Procesamiento e IA - Python
  python-core:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    container_name: python_ai
    restart: always
    expose:
      - "5000"
    volumes:
      - ./python-ai:/app
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '1.20'
          memory: 2048M
        reservations:
          memory: 512M

  # Procesos de STT
  stt_service:
    build:
      context: ./stt-service
      dockerfile: Dockerfile
    container_name: stt_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./asterisk/sounds:/app/sounds